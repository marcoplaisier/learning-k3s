apiVersion: apps/v1
kind: Deployment
metadata:
  name: bulk-storage-provisioner
  namespace: bulk-storage
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bulk-storage-provisioner
  template:
    metadata:
      labels:
        app: bulk-storage-provisioner
    spec:
      serviceAccountName: bulk-storage-provisioner
      containers:
        - name: local-path-provisioner
          image: rancher/local-path-provisioner:v0.0.37
          imagePullPolicy: IfNotPresent
          command:
            - local-path-provisioner
            - start
            - --config
            - /etc/config/config.json
            - --provisioner-name
            - rancher.io/local-path-bulk
            - --configmap-name
            - bulk-storage-config
            - --service-account-name
            - bulk-storage-provisioner
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONFIG_MOUNT_PATH
              value: /etc/config/
          volumeMounts:
            - name: config-volume
              mountPath: /etc/config/
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: config-volume
          configMap:
            name: bulk-storage-config
